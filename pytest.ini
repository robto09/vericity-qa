[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output: verbose, show reasons for skips, short tracebacks.
addopts = -v -ra --tb=short --strict-markers

# Markers are declared in conftest.py (pytest_configure). --strict-markers above
# makes a typo'd marker an error rather than a silent no-op.
